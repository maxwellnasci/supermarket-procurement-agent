[project]
name = "supermarket-procurement-agent"
version = "0.2.0"
description = "Motor determinístico de pré-pedido e agente de compras do Rede Varejo Premium - Loja Conceito"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
